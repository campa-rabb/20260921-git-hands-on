<!-- このファイルは単独のページではなく、一覧に貼り付けるカードのひな形です。
     article 全体を index.html の #shop-list の中にコピーしてください。
     href を自分の店舗 HTML のファイル名に合わせ、店名・紹介・所在地を変更します。
     data-category は food / cafe / books / goods / flowers のいずれかです。
     data-shop は詳細ページの main と同じ値にします。色の設定方法は README.md を参照してください。
     カテゴリの日本語表示も、飲食店 / 喫茶店 / 書店 / 雑貨店 / 花屋に合わせます。
     画像なしなら共通画像をそのまま使えます。画像を変える場合は alt も変更してください。 -->
<article class="shop-card" data-category="cafe" data-shop="p01-nami-cafe">
  <a class="shop-card-link" href="./shops/p01-nami-cafe.html">
    <div class="shop-card-image">
      <img src="./images/shop-placeholder.svg" alt="小さなお店を描いた共通店舗イラスト" width="800" height="560" loading="lazy" />
      <span class="card-visit" aria-hidden="true">↗</span>
    </div>
    <div class="shop-card-body">
      <p class="card-meta">
        <span class="category-label">喫茶店</span>
        <span class="card-address">こもれび通り 8 番</span>
      </p>
      <h3>なみ喫茶</h3>
      <p class="card-tagline">窓辺の一杯で、ひとやすみ。</p>
      <p class="card-description">海へ続く通りにある、小さな喫茶店です。香り豊かなコーヒーと季節の焼き菓子をご用意しています。お買いものの途中に、窓辺の席でゆっくり過ごしてください。</p>
      <span class="card-detail">お店について <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
